name: chat_story_generator
description: A production-quality chat story generator for content creators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  dartz: ^0.10.1
  equatable: ^2.0.5
  uuid: ^4.2.1
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  emoji_picker_flutter: ^3.1.0
  characters: ^1.4.1
  photo_manager: ^3.11.0
  file_picker: ^11.0.3
  widget_recorder_plus: ^1.0.5
  open_filex: ^4.7.0
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
